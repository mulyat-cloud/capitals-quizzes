<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capitals Quiz</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: Georgia, serif;
            background-color: #2E6F40;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 540px;
            width: 100%;
        }

        .star-banner {
            font-size: 24px;
            letter-spacing: 8px;
            margin-bottom: 24px;
            opacity: 0.7;
        }

        h1 {
            font-size: clamp(36px, 8vw, 60px);
            font-weight: bold;
            line-height: 1.1;
            margin-bottom: 8px;
        }

        h1 span { color: #7fcc96; }

        .subtitle {
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.6;
            margin-bottom: 48px;
        }

        .divider {
            width: 60px;
            height: 3px;
            background: rgba(255,255,255,0.4);
            margin: 0 auto 48px;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .quiz-btn {
            background: #245534;
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 28px 32px;
            text-align: left;
            cursor: pointer;
            font-family: Georgia, serif;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }

        .quiz-btn:hover {
            background: #3a8a50;
            border-color: white;
            transform: translateX(6px);
        }

        .quiz-btn-left { display: flex; flex-direction: column; gap: 6px; }

        .quiz-flag { font-size: 32px; margin-bottom: 4px; }

        .quiz-title {
            font-size: 20px;
            font-weight: bold;
        }

        .quiz-desc {
            font-size: 13px;
            opacity: 0.6;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .quiz-arrow {
            font-size: 24px;
            opacity: 0.5;
        }

        .quiz-btn:hover .quiz-arrow { opacity: 1; }
    </style>
</head>
<body>
<div class="container">
    <div class="star-banner">★ ★ ★ ★ ★</div>
    <h1>Capitals<br><span>Quiz</span></h1>
    <p class="subtitle">Choose your challenge</p>
    <div class="divider"></div>
    <div class="quiz-options">
        <a class="quiz-btn" href="us-quiz.html">
            <div class="quiz-btn-left">
                <div class="quiz-flag"></div>
                <div class="quiz-title">US State Capitals</div>
                <div class="quiz-desc">50 states · Multiple choice</div>
            </div>
            <div class="quiz-arrow">→</div>
        </a>
        <a class="quiz-btn" href="world-quiz.html">
            <div class="quiz-btn-left">
                <div class="quiz-flag"></div>
                <div class="quiz-title">World Capitals</div>
                <div class="quiz-desc">195 countries · Multiple choice</div>
            </div>
            <div class="quiz-arrow">→</div>
        </a>
    </div>
</div>
</body>
</html>
